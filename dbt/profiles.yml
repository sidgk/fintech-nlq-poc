# dbt connection profile.
# DBT_HOST defaults to 127.0.0.1 (forces IPv4 → the Docker Postgres; plain
# "localhost" can resolve to IPv6 ::1 and hit a different local Postgres) and
# is set to "db" when dbt runs INSIDE the Airflow/Cosmos container.
fintech:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '55432') | as_number }}"
      user: postgres
      password: postgres
      dbname: demo
      schema: gold          # default target; per-layer +schema overrides this
      threads: 4
